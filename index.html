<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Jackspace - Galactic Grooves 🛸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
        }

        /* Living Room Scene - View from behind */
        .living-room {
            width: 100vw;
            height: 100vh;
            background: #1a0033;
            /* Fallback color */
            background-image: url('/images/alien-room-concept-final.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .living-room.tv-mode {
            transform: scale(0);
            opacity: 0;
        }

        /* Stars through window */
        .stars {
            position: absolute;
            width: 100%;
            height: 60%;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        /* Alien TV in center */
        .tv-container {
            position: absolute;
            top: 35%;
            /* Adjusted for image */
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            /* Adjusted for image */
            height: 280px;
            /* Adjusted for image */
            cursor: pointer;
            transition: all 0.4s;
            opacity: 0.8;
        }

        .tv-container:hover {
            transform: translateX(-50%) scale(1.08);
            opacity: 1;
        }

        .tv-body {
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 30px;
            position: relative;
        }

        .tv-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            border: none;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }

        .tv-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            animation: tv-pulse 2s infinite;
        }

        @keyframes tv-pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(0, 255, 136, 0.2);
            border: 4px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
        }

        .tv-container:hover .play-button {
            background: rgba(0, 255, 136, 0.4);
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.9);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 30px solid #00ff88;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 8px;
        }

        .play-text {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 20px #00ff88;
            letter-spacing: 3px;
            white-space: nowrap;
        }

        .tv-container:hover .play-text {
            opacity: 1;
        }

        /* Fullscreen DJ Site */
        .dj-site {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        .dj-site.active {
            opacity: 1;
            pointer-events: all;
        }

        .dj-site iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1001;
            padding: 15px 30px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .back-button:hover {
            background: #00ff88;
            transform: scale(1.1);
        }

        /* Easter Eggs */
        .ufo {
            position: absolute;
            top: 15%;
            left: -100px;
            width: 60px;
            height: 30px;
            background: linear-gradient(180deg, silver 0%, #999 100%);
            border-radius: 50%;
            animation: fly-across 20s linear infinite;
            cursor: pointer;
            transition: transform 0.3s;
            opacity: 0.7;
        }

        .ufo:hover {
            transform: scale(1.5) rotate(15deg);
            opacity: 1;
        }

        .ufo::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ffff;
        }

        @keyframes fly-across {
            0% {
                left: -100px;
                top: 15%;
            }

            50% {
                left: 50%;
                top: 10%;
            }

            100% {
                left: calc(100% + 100px);
                top: 15%;
            }
        }

        .easter-egg-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #00ff88;
        }

        .secret-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff00ff;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 20px #ff00ff;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 25px;
            border: 2px solid #ff00ff;
            z-index: 2000;
        }

        .secret-message.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Loading Indicator -->
    <div id="loader"
        style="position:fixed; inset:0; background:black; z-index:2000; display:flex; align-items:center; justify-content:center; color:#00ff88; font-family:monospace; transition: opacity 0.5s;">
        LOADING ALIEN LINK...
    </div>

    <!-- Living Room Scene -->
    <div class="living-room" id="livingRoom">
        <!-- Stars -->
        <div class="stars" id="stars" style="opacity: 0.5;"></div>

        <!-- UFO Easter Egg -->
        <div class="ufo" onclick="ufoClick()" title="Click the UFO!" style="top: 10%;"></div>

        <!-- TV in center -->
        <div class="tv-container" onclick="enterTVMode()">
            <div class="tv-body">
                <div class="tv-screen">
                    <div class="tv-glow"></div>
                    <div class="play-button">
                        <div class="play-icon"></div>
                    </div>
                </div>
            </div>
            <div class="play-text">▶ PLAY</div>
        </div>

        <!-- Hidden Clickable Zones for Easter Eggs -->
        <div onclick="dogClick()" title="Pet the dog"
            style="position: absolute; bottom: 15%; left: 20%; width: 100px; height: 100px; cursor: pointer; z-index: 10;">
        </div>
        <div onclick="catClick()" title="Pet the cat"
            style="position: absolute; bottom: 15%; right: 20%; width: 80px; height: 80px; cursor: pointer; z-index: 10;">
        </div>
        <div onclick="showSecret(eggMessages.snacks)" title="Steal a snack"
            style="position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%); width: 100px; height: 60px; cursor: pointer; z-index: 10;">
        </div>
    </div>

    <!-- Video Intro -->
    <div class="video-intro" id="videoIntro"
        style="display: none; position: fixed; inset: 0; background: #000; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.5s;">
        <video id="introVideo" style="width: 100%; height: 100%; object-fit: cover;" preload="auto" playsinline>
            <source src="https://raw.githubusercontent.com/jackspace/djjackspace/main/videos/alien-intro.mp4"
                type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <!-- Fullscreen DJ Site -->
    <div class="dj-site" id="djSite">
        <button class="back-button" onclick="exitTVMode()">← BACK TO LIVING ROOM</button>
        <iframe src="main.html" title="DJ Jackspace - Galactic Grooves"></iframe>
    </div>

    <!-- Easter Egg Counter -->
    <div class="easter-egg-counter" id="eggCounter">
        🥚 Secrets: <span id="eggCount">0</span>/6
        // Add rainbow animation
        const style = document.createElement('style');
        style.textContent = `
        @keyframes rainbow {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
        }
        `;
        document.head.appendChild(style);
        </script>
</body>

</html>
